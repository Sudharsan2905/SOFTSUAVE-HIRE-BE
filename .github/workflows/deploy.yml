name: Deploy Backend

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ubuntu
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            set -e

            cd /var/www/SOFTSUAVE-HIRE-BE

            git checkout main

            echo "Pulling latest code..."
            git pull origin main

            echo "Installing Python dependencies..."
            source venv/bin/activate
            pip install -r requirements/base.txt
            deactivate

            echo "Restarting API..."
            sudo systemctl restart softsuave-api

            echo "Waiting for service..."
            sleep 5
            for i in $(seq 1 12); do
              if curl -fsS http://127.0.0.1:8000/api/health >/dev/null; then
                echo "Health check passed"; break
              fi
              if [ "$i" = "12" ]; then
                echo "Health check FAILED"; sudo journalctl -u softsuave-api -n 50 --no-pager; exit 1
              fi
              sleep 5
            done

            sudo systemctl --no-pager --full status softsuave-api

            echo "Backend deployment completed"
