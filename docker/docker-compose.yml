services:
  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: talentia-api
    ports:
      - "8000:8000"
    env_file:
      - ../.env
    environment:
      # Override MONGODB_URL to point at the mongo service inside Docker
      MONGODB_URL: mongodb://mongo:27017
      # Multi-worker: set UVICORN_WORKERS>1 AND REDIS_URL (start with `--profile redis`)
      UVICORN_WORKERS: ${UVICORN_WORKERS:-1}
      REDIS_URL: ${REDIS_URL:-}
      SCREENSHOTS_DIR: /app/uploads/screenshots
    volumes:
      - screenshots:/app/uploads/screenshots
    depends_on:
      mongo:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - hire-net

  mongo:
    image: mongo:7.0
    container_name: talentia-mongo
    # Mongo is reachable only on the internal network (no host port, no public exposure).
    # Enable authentication in production: set MONGO_INITDB_ROOT_USERNAME/PASSWORD here
    # and use mongodb://user:pass@mongo:27017/?authSource=admin in MONGODB_URL.
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped
    networks:
      - hire-net

  # Optional: shared WebSocket state for UVICORN_WORKERS>1 / several instances.
  #   REDIS_URL=redis://redis:6379/0 UVICORN_WORKERS=4 docker compose --profile redis up
  redis:
    image: redis:7
    container_name: talentia-redis
    profiles: ["redis"]
    command: ["redis-server", "--save", "", "--appendonly", "no"]  # ephemeral presence/pubsub only
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    networks:
      - hire-net

volumes:
  mongo_data:
  screenshots:

networks:
  hire-net:
    driver: bridge
